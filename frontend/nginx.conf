server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;


    # --------------------------------------------------------
    # MEDIA STREAMING
    # --------------------------------------------------------
    #
    # Video/audio gets its own proxy configuration so nginx can
    # absorb short NAS/backend/Wi-Fi timing dips instead of
    # forwarding every upstream pause directly to the player.
    #
    # Query strings such as ?relativePath=... still match this
    # exact /api/media location.
    #
    location = /api/media {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve seeking / partial-content playback.
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_force_ranges on;

        # Keep a modest amount of media in nginx memory.
        # 32 x 256k gives nginx up to roughly 8 MB of proxy
        # buffers without writing the video to a temporary file.
        proxy_buffering on;
        proxy_buffer_size 256k;
        proxy_buffers 32 256k;
        proxy_busy_buffers_size 2m;
        proxy_max_temp_file_size 0;

        proxy_request_buffering off;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # --------------------------------------------------------
    # NORMAL BACKEND API
    # --------------------------------------------------------
    #
    # Keep ordinary API calls low-latency and unbuffered.
    #
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_buffering off;
        proxy_request_buffering off;

        client_max_body_size 32m;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }


    # React Router SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
